<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tactile Generation Viewer</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #111; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tab { padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; background: #fff; font-size: 14px; }
  .tab.active { background: #222; color: #fff; border-color: #222; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; }
  .card .clip-label { font-size: 13px; color: #555; margin-bottom: 8px; word-break: break-word; }
  .clip-label b { color: #111; }
  .row { display: flex; gap: 8px; margin-bottom: 6px; }
  .vid-block { text-align: center; }
  .vid-block span { display: block; font-size: 11px; color: #777; margin-bottom: 2px; }
  video { width: 130px; height: 130px; background: #000; border-radius: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Tactile Generation Viewer</h1>
  <div id="subtitle" style="font-size:13px;color:#666;"></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

<script>
async function main() {
  const manifest = await (await fetch('manifest.json')).json();
  const tabs = document.getElementById('tabs');
  const grid = document.getElementById('grid');
  const subtitle = document.getElementById('subtitle');
  const keys = Object.keys(manifest);
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const video = entry.target;
      if (entry.isIntersecting && document.visibilityState === 'visible') {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }
  }, { threshold: 0.25 });

  document.addEventListener('visibilitychange', () => {
    grid.querySelectorAll('video').forEach(video => {
      if (document.visibilityState === 'hidden') video.pause();
      else if (video.getBoundingClientRect().bottom > 0 && video.getBoundingClientRect().top < innerHeight) {
        video.play().catch(() => {});
      }
    });
  });

  function render(key) {
    const cfg = manifest[key];
    subtitle.textContent = `${cfg.title} — ${cfg.clips.length} clips`;
    grid.querySelectorAll('video').forEach(video => {
      observer.unobserve(video);
      video.pause();
    });
    grid.innerHTML = '';
    for (const clip of cfg.clips) {
      const card = document.createElement('div');
      card.className = 'card';

      const label = document.createElement('div');
      label.className = 'clip-label';
      label.innerHTML = `<b>Clip ${clip.idx}</b> — ${cfg.title} — ${clip.name}`;
      card.appendChild(label);

      const rgbRow = document.createElement('div');
      rgbRow.className = 'row';
      rgbRow.appendChild(vidBlock('Egocentric RGB', `videos/${key}/${clip.files.rgb}`));
      card.appendChild(rgbRow);
      for (const hand of cfg.hands) {
        const row = document.createElement('div');
        row.className = 'row';
        const label2 = cfg.hands.length > 1 ? (hand === 'left' ? 'L' : 'R') : '';
        row.appendChild(vidBlock(`Tactile Gen ${label2}`, `videos/${key}/${clip.files['gen_' + hand]}`));
        row.appendChild(vidBlock(`Tactile GT ${label2}`, `videos/${key}/${clip.files['gt_' + hand]}`));
        card.appendChild(row);
      }
      grid.appendChild(card);
    }
  }

  function vidBlock(labelText, src) {
    const wrap = document.createElement('div');
    wrap.className = 'vid-block';
    const span = document.createElement('span');
    span.textContent = labelText;
    const v = document.createElement('video');
    v.src = src; v.controls = true; v.preload = 'none'; v.loop = true; v.muted = true; v.playsInline = true;
    observer.observe(v);
    wrap.appendChild(span); wrap.appendChild(v);
    return wrap;
  }

  keys.forEach((key, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = manifest[key].title;
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      render(key);
    };
    tabs.appendChild(tab);
  });

  render(keys[0]);
}
main();
</script>
</body>
</html>
