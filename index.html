<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tactile Generation Viewer</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #111; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tab { padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; background: #fff; font-size: 14px; }
  .tab.active { background: #222; color: #fff; border-color: #222; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; }
  .card .clip-label { font-size: 13px; color: #555; margin-bottom: 8px; word-break: break-word; }
  .clip-label b { color: #111; }
  .row { display: flex; gap: 8px; margin-bottom: 6px; }
  .vid-block { text-align: center; }
  .vid-block span { display: block; font-size: 11px; color: #777; margin-bottom: 2px; }
  video { width: 130px; height: 130px; background: #000; border-radius: 4px; }
  .load-more { grid-column: 1 / -1; text-align: center; padding: 16px; color: #666; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Tactile Generation Viewer</h1>
  <div id="subtitle" style="font-size:13px;color:#666;"></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

<script src="manifest.js"></script>
<script>
async function main() {
  const manifest = window.GALLERY_MANIFEST;
  const tabs = document.getElementById('tabs');
  const grid = document.getElementById('grid');
  const subtitle = document.getElementById('subtitle');
  const keys = Object.keys(manifest);
  const groups = new WeakMap();
  let loadObserver;

  function playGroup(group) {
    if (!group.visible || document.visibilityState !== 'visible') return;
    group.playing = true;
    startReadyGroup(group);
  }

  function startReadyGroup(group) {
    if (!group.playing || group.running || !group.videos.every(video => video.readyState >= 3 && !video.seeking)) return;
    const position = Math.min(...group.videos.map(video => video.currentTime));
    let aligned = true;
    group.videos.forEach(video => {
      if (Math.abs(video.currentTime - position) > 0.1) {
        video.currentTime = position;
        aligned = false;
      }
    });
    if (!aligned) return;
    group.running = true;
    group.videos.forEach(video => video.play().catch(() => {
      if (group.running) {
        group.running = false;
        group.videos.forEach(other => other.pause());
      }
    }));
  }

  function pauseGroup(group) {
    group.playing = false;
    group.running = false;
    group.videos.forEach(video => video.pause());
  }

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const group = groups.get(entry.target);
      group.visible = entry.isIntersecting;
      if (group.visible) {
        group.videos.forEach(video => {
          if (!video.hasAttribute('src')) {
            video.preload = 'auto';
            video.src = video.dataset.src;
            video.load();
          }
        });
        playGroup(group);
      } else {
        pauseGroup(group);
        group.videos.forEach(video => {
          if (video.hasAttribute('src')) {
            video.removeAttribute('src');
            video.load();
          }
        });
      }
    }
  }, { threshold: 0.01 });

  document.addEventListener('visibilitychange', () => {
    grid.querySelectorAll('.card').forEach(card => {
      const group = groups.get(card);
      if (document.visibilityState === 'hidden') pauseGroup(group);
      else if (group.visible) playGroup(group);
    });
  });

  function render(key) {
    const cfg = manifest[key];
    subtitle.textContent = `${cfg.title} — ${cfg.clips.length} clips`;
    if (loadObserver) loadObserver.disconnect();
    grid.querySelectorAll('.card').forEach(card => {
      observer.unobserve(card);
      pauseGroup(groups.get(card));
    });
    grid.innerHTML = '';
    const sentinel = document.createElement('div');
    sentinel.className = 'load-more';
    sentinel.textContent = 'Loading more clips…';
    grid.appendChild(sentinel);
    let nextClip = 0;

    function appendNext() {
      for (const clip of cfg.clips.slice(nextClip, nextClip + 12)) {
      const card = document.createElement('div');
      card.className = 'card';

      const label = document.createElement('div');
      label.className = 'clip-label';
      label.innerHTML = `<b>Clip ${clip.idx}</b> — ${cfg.title} — ${clip.name}`;
      card.appendChild(label);

      const rgbRow = document.createElement('div');
      rgbRow.className = 'row';
      rgbRow.appendChild(vidBlock('Egocentric RGB', `videos/${key}/${clip.files.rgb}`));
      card.appendChild(rgbRow);
      for (const hand of cfg.hands) {
        const row = document.createElement('div');
        row.className = 'row';
        const label2 = cfg.hands.length > 1 ? (hand === 'left' ? 'L' : 'R') : '';
        row.appendChild(vidBlock(`Tactile Gen ${label2}`, `videos/${key}/${clip.files['gen_' + hand]}`));
        row.appendChild(vidBlock(`Tactile GT ${label2}`, `videos/${key}/${clip.files['gt_' + hand]}`));
        card.appendChild(row);
      }
      const group = { videos: [...card.querySelectorAll('video')], visible: false, playing: false, running: false, syncing: false };
      groups.set(card, group);
      for (const video of group.videos) {
        video.addEventListener('play', () => {
          if (!video.paused && !group.playing && group.visible) {
            video.pause();
            playGroup(group);
          }
        });
        video.addEventListener('pause', () => {
          if (video.paused && group.running) pauseGroup(group);
        });
        video.addEventListener('canplay', () => {
          startReadyGroup(group);
        });
        video.addEventListener('waiting', () => {
          if (!group.running) return;
          group.running = false;
          group.videos.forEach(other => other.pause());
        });
        video.addEventListener('seeking', () => {
          if (group.syncing) return;
          group.syncing = true;
          group.videos.forEach(other => {
            if (other !== video && other.readyState >= 1 && Math.abs(other.currentTime - video.currentTime) > 0.1) {
              other.currentTime = video.currentTime;
            }
          });
          group.syncing = false;
        });
        video.addEventListener('seeked', () => startReadyGroup(group));
      }
      grid.insertBefore(card, sentinel);
      observer.observe(card);
      }
      nextClip = Math.min(nextClip + 12, cfg.clips.length);
      if (nextClip === cfg.clips.length) {
        batchObserver.disconnect();
        sentinel.remove();
      }
    }
    const batchObserver = new IntersectionObserver(entries => {
      if (!sentinel.isConnected) return;
      if (!entries.some(entry => entry.isIntersecting)) return;
      batchObserver.unobserve(sentinel);
      appendNext();
      if (sentinel.isConnected) batchObserver.observe(sentinel);
    }, { rootMargin: '500px 0px' });
    loadObserver = batchObserver;
    appendNext();
    if (sentinel.isConnected) batchObserver.observe(sentinel);
  }

  function vidBlock(labelText, src) {
    const wrap = document.createElement('div');
    wrap.className = 'vid-block';
    const span = document.createElement('span');
    span.textContent = labelText;
    const v = document.createElement('video');
    v.dataset.src = src; v.controls = true; v.preload = 'none'; v.loop = true; v.muted = true; v.playsInline = true;
    wrap.appendChild(span); wrap.appendChild(v);
    return wrap;
  }

  keys.forEach((key, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = manifest[key].title;
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      render(key);
    };
    tabs.appendChild(tab);
  });

  render(keys[0]);
}
main();
</script>
</body>
</html>
